name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - run: shellcheck port-guard.sh pm2-inventory.sh marker-healthcheck.sh adapters/*.sh tests/run_tests.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./tests/run_tests.sh
